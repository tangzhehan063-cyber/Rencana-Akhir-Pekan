<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travel Planning</title>
<style>
:root{
  --bg:#f5f6f4;--card:#fff;--ink:#14201e;--mut:#667471;--line:#e3e8e6;
  --acc:#0f766e;--acc-soft:#d9f2ee;--ok:#15803d;--ok-soft:#dcf5e4;
  --bad:#b91c1c;--bad-soft:#fde4e4;--warn:#a16207;--warn-soft:#fdf0cf;
  --r:14px;--shadow:0 1px 2px rgba(20,32,30,.06),0 4px 14px rgba(20,32,30,.05);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1514;--card:#182120;--ink:#e8efed;--mut:#93a39f;--line:#273331;
    --acc:#2dd4bf;--acc-soft:#12403b;--ok:#4ade80;--ok-soft:#133a22;
    --bad:#f87171;--bad-soft:#47191a;--warn:#facc15;--warn-soft:#3f3510;--shadow:none}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:14px 14px 90px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
h1{font-size:20px;margin:0;letter-spacing:-.01em}
.sub{color:var(--mut);font-size:13px;margin-top:2px}
.actions{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 13px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--acc)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
@media (prefers-color-scheme:dark){.btn.primary{color:#04201c}}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:99px;background:var(--acc-soft);color:var(--acc);font-weight:600}
.pill.err{background:var(--bad-soft);color:var(--bad)}
.pill.busy{background:var(--warn-soft);color:var(--warn)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:8px 0 14px}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 12px;cursor:pointer;color:var(--mut);font-weight:600;white-space:nowrap}
nav.tabs button.on{color:var(--acc);border-bottom-color:var(--acc)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar input,.toolbar select{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 11px;min-width:0}
.toolbar input{flex:1 1 180px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.two{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-top:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:14px;color:var(--mut);font-weight:600}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.kpi .l{font-size:12px;color:var(--mut);margin-top:3px}
.kpi.ok .v{color:var(--ok)}.kpi.bad .v{color:var(--bad)}.kpi.acc .v{color:var(--acc)}
.bar{display:grid;grid-template-columns:110px 1fr auto;gap:8px;align-items:center;margin:7px 0;font-size:13px}
.bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{height:9px;border-radius:9px;background:var(--acc-soft);overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--acc);border-radius:9px}
.bar .n{color:var(--mut);font-variant-numeric:tabular-nums;text-align:right}
.empty{color:var(--mut);font-size:14px;padding:6px 0}
.day{margin-bottom:18px}
.day h2{font-size:14px;margin:0 0 8px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.day h2 small{color:var(--mut);font-weight:500}
.today-tag{background:var(--acc);color:#fff;border-radius:6px;padding:1px 7px;font-size:11px}
.item{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:start;padding:11px 12px;margin-bottom:8px;cursor:pointer}
.item:hover{border-color:var(--acc)}
.item .tm{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px}
.item .tm small{display:block;color:var(--mut);font-weight:500;font-size:12px}
.item .loc{font-weight:600}
.item .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.chip{font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:1px 8px;color:var(--mut)}
.note{color:var(--mut);font-size:13.5px;margin-top:2px}
.st{border:0;border-radius:99px;padding:4px 11px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.st.Selesai{background:var(--ok-soft);color:var(--ok)}
.st.Cancel{background:var(--bad-soft);color:var(--bad)}
.st.Rencana{background:var(--warn-soft);color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl{overflow-x:auto;padding:0}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
td.wrapc{white-space:normal;min-width:150px}
th{color:var(--mut);font-weight:600;font-size:12px;background:var(--card);position:sticky;top:0}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--bg)}
td.r,th.r{text-align:right}
.todo{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.todo:first-of-type{border-top:0}
.todo .t{min-width:0}.todo .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.todo .t span{color:var(--mut);font-size:12.5px}
.todo .b{display:flex;gap:6px;flex:none}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,18,16,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal.hidden{display:none}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px}
@media (min-width:640px){.modal{align-items:center}.sheet{border-radius:18px}}
.sheet h2{margin:0 0 12px;font-size:18px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f label{display:block;font-size:12px;color:var(--mut);font-weight:600}
.f label.full{grid-column:1/-1}
.f input,.f select,.f textarea{width:100%;margin-top:4px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px}
.f textarea{resize:vertical;min-height:58px}
.f input:focus,.f select:focus,.f textarea:focus,.toolbar input:focus{outline:2px solid var(--acc);outline-offset:0}
.foot{display:flex;gap:8px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
.foot .r{display:flex;gap:8px;margin-left:auto}
.ferr{color:var(--bad);font-size:13px;margin-top:8px;min-height:1em}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#14201e;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:40;max-width:90vw;display:none}
#banner{margin-bottom:12px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.fab{position:fixed;right:16px;bottom:16px;z-index:10;box-shadow:0 6px 18px rgba(0,0,0,.25);border-radius:99px;padding:12px 18px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Rencana Akhir Pekan</h1>
      <div class="sub"><span id="sync" class="pill busy">Memuat…</span></div>
    </div>
    <div class="actions">
      <button class="btn" data-act="reload" title="Muat ulang dari Sheet">Muat ulang</button>
      <button class="btn primary" data-act="add">+ Aktivitas</button>
    </div>
  </header>
  <div id="banner"></div>
  <nav class="tabs" id="tabs">
    <button data-act="tab" data-tab="dash" class="on">Dashboard</button>
    <button data-act="tab" data-tab="timeline">Timeline</button>
    <button data-act="tab" data-tab="table">Tabel</button>
    <button data-act="tab" data-tab="loc">Lokasi</button>
  </nav>
  <div id="toolbar"></div>
  <main id="view"><div class="empty">Memuat data dari Sheet…</div></main>
</div>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <form class="sheet" id="form" autocomplete="off">
    <h2 id="mTitle">Aktivitas</h2>
    <div class="f">
      <label>Tanggal<input type="date" id="fDate" required></label>
      <label>Status
        <select id="fResult"><option>Rencana</option><option>Selesai</option><option>Cancel</option></select>
      </label>
      <label>Jam mulai<input type="time" id="fMulai" required></label>
      <label>Jam selesai<input type="time" id="fSelesai" required></label>
      <label class="full">Lokasi<input id="fLokasi" placeholder="Nama tempat"></label>
      <label class="full">Catatan<textarea id="fCatatan" placeholder="Mau ngapain di sini?"></textarea></label>
      <label>Pemilik<input id="fPemilik" placeholder="Siapa yang ikut/punya"></label>
      <label>Kategori<select id="fKategori"></select></label>
      <label>Pengeluaran (Rp)<input id="fSpend" inputmode="numeric" placeholder="0"></label>
      <label>Grup rencana<input id="fPlan" placeholder="mis. TRIP TO DIENG"></label>
    </div>
    <div class="ferr" id="fErr"></div>
    <div class="foot">
      <button type="button" class="btn danger" id="btnDel" data-act="del">Hapus</button>
      <div class="r">
        <button type="button" class="btn" data-act="close">Batal</button>
        <button type="submit" class="btn primary">Simpan</button>
      </div>
    </div>
  </form>
</div>
<div id="toast"></div>

<script>
// <pure>
const DAYS = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const CATS = ['Tempat Makan','Perawatan','Belanja & Hiburan','Olahraga','Wisata & Perjalanan','Lainnya'];
const pad2 = n => String(n).padStart(2, '0');

function dmyToIso(s) {
  const m = String(s || '').trim().match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if (m) return m[3] + '-' + pad2(m[2]) + '-' + pad2(m[1]);
  return /^\d{4}-\d{2}-\d{2}$/.test(String(s || '').trim()) ? String(s).trim() : '';
}
function isoToDmy(iso) {
  const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? m[3] + '/' + m[2] + '/' + m[1] : '';
}
function dayName(iso) {
  const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? DAYS[new Date(+m[1], +m[2] - 1, +m[3]).getDay()] : '';
}
function normTime(t) {
  const m = String(t || '').match(/(\d{1,2}):(\d{2})/);
  if (!m) return '';
  return pad2(Math.min(23, +m[1])) + ':' + pad2(Math.min(59, +m[2]));
}
function toMin(hhmm) {
  const m = String(hhmm || '').match(/^(\d{1,2}):(\d{2})/);
  return m ? +m[1] * 60 + +m[2] : 0;
}
function durFrom(a, b) {
  const s = toMin(a), e = toMin(b);
  return e >= s ? e - s : 1440 - s + e;
}
function normResult(r) {
  const v = String(r || '').trim().toLowerCase();
  if (v === 'selesai' || v === 'done') return 'Selesai';
  if (v === 'cancel' || v === 'batal') return 'Cancel';
  return 'Rencana';
}
function guessCat(text) {
  const t = String(text || '').toLowerCase();
  if (/makan|resto|cafe|kafe|kfc|ayam|sate|warung|\brm\b|rm\.|bakso|sambel|mancing|kopi|bakery|mie |nasi/.test(t)) return 'Tempat Makan';
  if (/barber|salon|beauty|clinic|klinik|facial|pedicure|perawatan|spa|potong rambut/.test(t)) return 'Perawatan';
  if (/mall|supermall|xxi|nonton|bioskop|cinema|belanja|game|stardew/.test(t)) return 'Belanja & Hiburan';
  if (/lari|gor\b|gelanggang|olahraga|gym|renang|futsal|jogging/.test(t)) return 'Olahraga';
  if (/dieng|wisata|trip|pantai|candi|gunung|vihara|jogja|magelang|pantai|museum|taman/.test(t)) return 'Wisata & Perjalanan';
  return 'Lainnya';
}
function normCat(v, hint) {
  const x = String(v || '').trim();
  if (CATS.indexOf(x) >= 0) return x;
  return guessCat(hint);
}
function newId() { return 'r' + Math.random().toString(36).slice(2, 10); }
function todayIso() {
  const d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}

/** rows (2D string dari Sheet, boleh dengan header) -> array item */
function parseRows(rows) {
  const out = [];
  let last = '';
  (rows || []).forEach(function (c, i) {
    if (i === 0 && /waktu mulai|jam mulai|lokasi/i.test(c.join(' '))) return;
    if (c.every(function (x) { return !String(x == null ? '' : x).trim(); })) return;
    const d = dmyToIso(c[0]);
    if (d) last = d;
    const date = d || last || todayIso();
    const mulai = normTime(c[3]) || '08:00';
    const selesai = normTime(c[4]) || '09:00';
    const durNum = parseInt(c[2], 10);
    const lokasi = String(c[5] || '').replace(/\s+/g, ' ').trim();
    const catatan = String(c[7] || '').trim();
    const plan = String(c[9] || '').trim();
    const digits = String(c[12] || '').replace(/[^\d]/g, '');
    out.push({
      id: newId(),
      date: date,
      hari: String(c[1] || '').trim() || dayName(date),
      mulai: mulai,
      selesai: selesai,
      durasi: isFinite(durNum) && durNum >= 0 ? durNum : durFrom(mulai, selesai),
      lokasi: lokasi,
      pemilik: String(c[6] || '').trim(),
      catatan: catatan,
      result: normResult(c[8]),
      plan: plan,
      kategori: normCat(c[10], lokasi + ' ' + catatan + ' ' + plan),
      estimasi: String(c[11] || '').trim(),
      spend: digits ? parseInt(digits, 10) : null
    });
  });
  return out;
}
function sortItems(items) {
  return items.slice().sort(function (a, b) {
    if (a.date !== b.date) return a.date < b.date ? -1 : 1;
    return toMin(a.mulai) - toMin(b.mulai);
  });
}
/** array item -> rows 13 kolom (tanpa header), tanggal hanya di baris pertama tiap hari */
function serialize(items) {
  let prev = '';
  return sortItems(items).map(function (it) {
    const show = it.date !== prev;
    prev = it.date;
    return [
      show ? isoToDmy(it.date) : '',
      it.hari || dayName(it.date),
      String(it.durasi),
      it.mulai + ':00',
      it.selesai + ':00',
      it.lokasi,
      it.pemilik,
      it.catatan,
      it.result === 'Rencana' ? '' : it.result,
      it.plan,
      it.kategori,
      it.estimasi || '',
      it.spend != null ? String(it.spend) : ''
    ];
  });
}
const fmtRp = n => 'Rp ' + Math.round(n || 0).toLocaleString('id-ID');
function fmtDur(min) {
  const h = Math.floor(min / 60), m = min % 60;
  if (!h) return m + ' mnt';
  return m ? h + ' j ' + m + ' m' : h + ' jam';
}
// </pure>

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s);
const MONTHS_ID = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const monthLabel = key => { const p = key.split('-'); return MONTHS_ID[+p[1] - 1] + ' ' + p[0]; };
const dateLong = iso => { const p = iso.split('-'); return dayName(iso) + ', ' + (+p[2]) + ' ' + MONTHS_ID[+p[1] - 1] + ' ' + p[0]; };

let items = [], version = '', tab = 'dash', editingId = null, loaded = false;
let flt = { q: '', status: '', month: '' };
let saving = false, dirty = false;

/* ---------- sinkron ---------- */
function setSync(kind, msg) {
  const el = $('#sync');
  el.className = 'pill' + (kind === 'err' ? ' err' : kind === 'busy' ? ' busy' : '');
  el.textContent = msg || (kind === 'busy' ? 'Menyimpan…' : kind === 'err' ? 'Gagal menyimpan' : 'Tersimpan di Sheet');
}
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', 4200);
}
function hasGas() { return typeof google !== 'undefined' && google.script && google.script.run; }

function load() {
  if (!hasGas()) { $('#view').innerHTML = '<div class="card empty">Halaman ini harus dibuka dari Google Sheet (menu Travel Planning) atau link Web App.</div>'; setSync('err', 'Tidak terhubung'); return; }
  setSync('busy', 'Memuat…');
  google.script.run
    .withSuccessHandler(res => {
      if (!res || !res.ok) { setSync('err', 'Gagal memuat'); toast((res && res.error) || 'Gagal memuat data'); return; }
      items = parseRows(res.rows); version = res.version; loaded = true; dirty = false;
      $('#banner').innerHTML = '';
      setSync('ok'); renderToolbar(); render();
    })
    .withFailureHandler(err => { setSync('err', 'Gagal memuat'); toast(err.message || String(err)); })
    .getData();
}

function persist() { dirty = true; render(); if (!saving) flush(); }
function flush() {
  if (!dirty) return;
  dirty = false; saving = true; setSync('busy');
  google.script.run
    .withSuccessHandler(res => {
      saving = false;
      if (res && res.ok) { version = res.version; if (dirty) flush(); else setSync('ok'); return; }
      if (res && res.error === 'CONFLICT') { showConflict(res); return; }
      setSync('err'); toast((res && res.error) || 'Gagal menyimpan');
    })
    .withFailureHandler(err => { saving = false; setSync('err'); toast(err.message || String(err)); })
    .saveData(serialize(items), version);
}
function showConflict(res) {
  window._conflict = res;
  setSync('err', 'Perlu dicek');
  $('#banner').innerHTML = '<div class="banner"><span>Sheet diubah dari tempat lain saat kamu mengedit. Pilih mana yang dipakai.</span><span class="actions">' +
    '<button class="btn sm" data-act="useSheet">Pakai data Sheet</button>' +
    '<button class="btn sm primary" data-act="overwrite">Timpa dengan perubahanku</button></span></div>';
}

/* ---------- render ---------- */
function setTab(t) {
  tab = t;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  renderToolbar(); render();
}
function renderToolbar() {
  const el = $('#toolbar');
  if (tab !== 'timeline' && tab !== 'table') { el.innerHTML = ''; return; }
  const months = [...new Set(items.map(i => i.date.slice(0, 7)))].sort().reverse();
  el.innerHTML = '<div class="toolbar">' +
    '<input id="q" type="search" placeholder="Cari lokasi, catatan, pemilik…" value="' + esc(flt.q) + '">' +
    '<select id="fs"><option value="">Semua status</option>' +
    ['Rencana', 'Selesai', 'Cancel'].map(s => '<option' + (flt.status === s ? ' selected' : '') + '>' + s + '</option>').join('') + '</select>' +
    '<select id="fm"><option value="">Semua bulan</option>' +
    months.map(m => '<option value="' + m + '"' + (flt.month === m ? ' selected' : '') + '>' + monthLabel(m) + '</option>').join('') + '</select></div>';
}
function filtered() {
  const q = flt.q.trim().toLowerCase();
  return items.filter(i =>
    (!flt.status || i.result === flt.status) &&
    (!flt.month || i.date.slice(0, 7) === flt.month) &&
    (!q || (i.lokasi + ' ' + i.catatan + ' ' + i.pemilik + ' ' + i.plan + ' ' + i.kategori).toLowerCase().indexOf(q) >= 0));
}
function render() {
  if (!loaded) return;
  const v = $('#view');
  if (tab === 'dash') v.innerHTML = viewDash();
  else if (tab === 'timeline') v.innerHTML = viewTimeline();
  else if (tab === 'table') v.innerHTML = viewTable();
  else v.innerHTML = viewLoc();
}
const stBtn = it => '<button class="st ' + it.result + '" data-act="cycle" data-id="' + it.id + '" title="Ubah status">' + it.result + '</button>';

function viewDash() {
  if (!items.length) return '<div class="card empty">Belum ada aktivitas. Klik “+ Aktivitas” untuk mulai.</div>';
  const n = items.length;
  const by = s => items.filter(i => i.result === s).length;
  const spend = items.reduce((a, i) => a + (i.spend || 0), 0);
  const mins = items.filter(i => i.result === 'Selesai').reduce((a, i) => a + i.durasi, 0);
  const kpi = (v, l, c) => '<div class="card kpi ' + (c || '') + '"><div class="v">' + v + '</div><div class="l">' + l + '</div></div>';

  const months = {};
  items.forEach(i => { const k = i.date.slice(0, 7); (months[k] = months[k] || { n: 0, s: 0 }); months[k].n++; months[k].s += i.spend || 0; });
  const mKeys = Object.keys(months).sort().slice(-6);
  const mMax = Math.max.apply(null, mKeys.map(k => months[k].n));
  const mBars = mKeys.map(k => '<div class="bar"><span class="nm">' + monthLabel(k) + '</span><span class="tr"><i style="width:' + (months[k].n / mMax * 100) + '%"></i></span><span class="n">' + months[k].n + (months[k].s ? ' · ' + fmtRp(months[k].s) : '') + '</span></div>').join('');

  const cats = {};
  items.forEach(i => { (cats[i.kategori] = cats[i.kategori] || { n: 0, s: 0 }); cats[i.kategori].n++; cats[i.kategori].s += i.spend || 0; });
  const cKeys = Object.keys(cats).sort((a, b) => cats[b].n - cats[a].n);
  const cMax = cats[cKeys[0]].n;
  const cBars = cKeys.map(k => '<div class="bar"><span class="nm">' + esc(k) + '</span><span class="tr"><i style="width:' + (cats[k].n / cMax * 100) + '%"></i></span><span class="n">' + cats[k].n + (cats[k].s ? ' · ' + fmtRp(cats[k].s) : '') + '</span></div>').join('');

  const locs = {};
  items.forEach(i => { if (i.lokasi) locs[i.lokasi] = (locs[i.lokasi] || 0) + 1; });
  const lKeys = Object.keys(locs).sort((a, b) => locs[b] - locs[a]).slice(0, 5);
  const lMax = lKeys.length ? locs[lKeys[0]] : 1;
  const lBars = lKeys.map(k => '<div class="bar"><span class="nm" title="' + esc(k) + '">' + esc(k) + '</span><span class="tr"><i style="width:' + (locs[k] / lMax * 100) + '%"></i></span><span class="n">' + locs[k] + '×</span></div>').join('');

  const nowKey = todayIso();
  const upcoming = sortItems(items).filter(i => i.result === 'Rencana' && i.date >= nowKey).slice(0, 4);
  const upHtml = upcoming.length ? upcoming.map(i => '<div class="todo"><div class="t"><b>' + esc(i.lokasi || i.catatan || '(tanpa nama)') + '</b><span>' + dateLong(i.date) + ' · ' + i.mulai + '–' + i.selesai + '</span></div></div>').join('') : '<div class="empty">Tidak ada rencana mendatang. Tambah satu.</div>';

  const stale = sortItems(items).filter(i => i.result === 'Rencana' && i.date < nowKey);
  const staleHtml = stale.length ? '<div class="card" style="margin-top:12px"><h3>Perlu status (' + stale.length + ' sudah lewat, belum ditandai)</h3>' +
    stale.slice(-6).reverse().map(i => '<div class="todo"><div class="t"><b>' + esc(i.lokasi || i.catatan || '(tanpa nama)') + '</b><span>' + dateLong(i.date) + ' · ' + i.mulai + '</span></div><div class="b"><button class="btn sm" data-act="setst" data-id="' + i.id + '" data-v="Selesai">Selesai</button><button class="btn sm" data-act="setst" data-id="' + i.id + '" data-v="Cancel">Cancel</button></div></div>').join('') +
    (stale.length > 6 ? '<div class="empty">+' + (stale.length - 6) + ' lainnya, lihat tab Timeline.</div>' : '') + '</div>' : '';

  const owners = {};
  items.forEach(i => { if (i.pemilik) { (owners[i.pemilik] = owners[i.pemilik] || { n: 0, s: 0 }); owners[i.pemilik].n++; owners[i.pemilik].s += i.spend || 0; } });
  const oKeys = Object.keys(owners);
  const oHtml = oKeys.length ? '<div class="card"><h3>Per pemilik</h3>' + oKeys.map(k => '<div class="bar" style="grid-template-columns:1fr auto"><span class="nm">' + esc(k) + '</span><span class="n">' + owners[k].n + ' aktivitas' + (owners[k].s ? ' · ' + fmtRp(owners[k].s) : '') + '</span></div>').join('') + '</div>' : '';

  return '<div class="grid kpis">' +
    kpi(n, 'Total aktivitas', 'acc') + kpi(by('Selesai'), 'Selesai', 'ok') + kpi(by('Rencana'), 'Rencana / belum ditandai') + kpi(by('Cancel'), 'Dibatalkan', 'bad') +
    kpi(fmtRp(spend), 'Total pengeluaran') + kpi(fmtDur(mins), 'Waktu kegiatan selesai') + '</div>' +
    staleHtml +
    '<div class="grid two"><div class="card"><h3>Agenda berikutnya</h3>' + upHtml + '</div>' +
    '<div class="card"><h3>Aktivitas per bulan</h3>' + mBars + '</div>' +
    '<div class="card"><h3>Per kategori</h3>' + cBars + '</div>' +
    '<div class="card"><h3>Tempat paling sering</h3>' + (lBars || '<div class="empty">Belum ada lokasi.</div>') + '</div>' +
    oHtml + '</div>';
}

function viewTimeline() {
  const list = filtered();
  if (!list.length) return '<div class="card empty">Tidak ada aktivitas yang cocok.</div>';
  const days = {};
  list.forEach(i => (days[i.date] = days[i.date] || []).push(i));
  const t = todayIso();
  return Object.keys(days).sort().reverse().map(d => {
    const arr = days[d].sort((a, b) => toMin(a.mulai) - toMin(b.mulai));
    const spend = arr.reduce((a, i) => a + (i.spend || 0), 0);
    const plan = arr.map(i => i.plan).filter(Boolean)[0];
    return '<section class="day"><h2>' + dateLong(d) + (d === t ? ' <span class="today-tag">Hari ini</span>' : '') +
      (plan ? ' <small>· ' + esc(plan) + '</small>' : '') + '<small>' + arr.length + ' kegiatan' + (spend ? ' · ' + fmtRp(spend) : '') + '</small></h2>' +
      arr.map(i => '<div class="card item" data-act="edit" data-id="' + i.id + '"><div class="tm">' + i.mulai + '<small>' + i.selesai + '</small></div>' +
        '<div><div class="loc">' + esc(i.lokasi || '(tanpa lokasi)') + '</div>' + (i.catatan ? '<div class="note">' + esc(i.catatan) + '</div>' : '') +
        '<div class="meta"><span class="chip">' + esc(i.kategori) + '</span><span class="chip">' + fmtDur(i.durasi) + '</span>' +
        (i.pemilik ? '<span class="chip">' + esc(i.pemilik) + '</span>' : '') + (i.spend ? '<span class="chip">' + fmtRp(i.spend) + '</span>' : '') + '</div></div>' +
        stBtn(i) + '</div>').join('') + '</section>';
  }).join('');
}

function viewTable() {
  const list = sortItems(filtered()).reverse();
  if (!list.length) return '<div class="card empty">Tidak ada aktivitas yang cocok.</div>';
  return '<div class="card tbl"><table><thead><tr><th>Tanggal</th><th>Jam</th><th>Lokasi</th><th>Catatan</th><th>Kategori</th><th>Pemilik</th><th>Status</th><th class="r">Pengeluaran</th></tr></thead><tbody>' +
    list.map(i => '<tr data-act="edit" data-id="' + i.id + '"><td>' + isoToDmy(i.date) + '</td><td>' + i.mulai + '–' + i.selesai + '</td><td class="wrapc">' + esc(i.lokasi) + '</td><td class="wrapc">' + esc(i.catatan) + '</td><td>' + esc(i.kategori) + '</td><td>' + esc(i.pemilik) + '</td><td>' + stBtn(i) + '</td><td class="r">' + (i.spend ? fmtRp(i.spend) : '') + '</td></tr>').join('') +
    '</tbody></table></div>';
}

function viewLoc() {
  const m = {};
  items.forEach(i => {
    const k = i.lokasi || '(tanpa lokasi)';
    const o = m[k] = m[k] || { n: 0, min: 0, s: 0, last: '', cat: i.kategori };
    o.n++; o.min += i.durasi; o.s += i.spend || 0; if (i.date > o.last) o.last = i.date;
  });
  const keys = Object.keys(m).sort((a, b) => m[b].n - m[a].n || (m[b].last < m[a].last ? -1 : 1));
  if (!keys.length) return '<div class="card empty">Belum ada lokasi.</div>';
  return '<div class="card tbl"><table><thead><tr><th>Lokasi</th><th>Kategori</th><th class="r">Kunjungan</th><th class="r">Total waktu</th><th class="r">Pengeluaran</th><th>Terakhir</th></tr></thead><tbody>' +
    keys.map(k => '<tr style="cursor:default"><td class="wrapc">' + esc(k) + '</td><td>' + esc(m[k].cat) + '</td><td class="r">' + m[k].n + '</td><td class="r">' + fmtDur(m[k].min) + '</td><td class="r">' + (m[k].s ? fmtRp(m[k].s) : '') + '</td><td>' + isoToDmy(m[k].last) + '</td></tr>').join('') +
    '</tbody></table></div>';
}

/* ---------- form ---------- */
function openForm(id) {
  editingId = id || null;
  const it = id ? items.find(x => x.id === id) : null;
  $('#mTitle').textContent = it ? 'Edit aktivitas' : 'Aktivitas baru';
  $('#fKategori').innerHTML = CATS.map(c => '<option>' + esc(c) + '</option>').join('');
  $('#fDate').value = it ? it.date : todayIso();
  $('#fMulai').value = it ? it.mulai : '09:00';
  $('#fSelesai').value = it ? it.selesai : '10:00';
  $('#fLokasi').value = it ? it.lokasi : '';
  $('#fCatatan').value = it ? it.catatan : '';
  $('#fPemilik').value = it ? it.pemilik : '';
  $('#fKategori').value = it ? it.kategori : 'Lainnya';
  $('#fSpend').value = it && it.spend != null ? it.spend : '';
  $('#fPlan').value = it ? it.plan : '';
  $('#fResult').value = it ? it.result : 'Rencana';
  $('#fErr').textContent = '';
  const del = $('#btnDel');
  del.style.visibility = it ? 'visible' : 'hidden';
  del.textContent = 'Hapus'; del.dataset.armed = '';
  $('#modal').classList.remove('hidden');
  setTimeout(() => $('#fLokasi').focus(), 30);
}
function closeForm() { $('#modal').classList.add('hidden'); editingId = null; }

$('#form').addEventListener('submit', e => {
  e.preventDefault();
  const date = $('#fDate').value, mulai = normTime($('#fMulai').value), selesai = normTime($('#fSelesai').value);
  const lokasi = $('#fLokasi').value.replace(/\s+/g, ' ').trim(), catatan = $('#fCatatan').value.trim();
  if (!date || !mulai || !selesai) { $('#fErr').textContent = 'Tanggal dan jam wajib diisi.'; return; }
  if (!lokasi && !catatan) { $('#fErr').textContent = 'Isi lokasi atau catatan.'; return; }
  const digits = $('#fSpend').value.replace(/[^\d]/g, '');
  const rec = {
    id: editingId || newId(), date: date, hari: dayName(date), mulai: mulai, selesai: selesai,
    durasi: durFrom(mulai, selesai), lokasi: lokasi, pemilik: $('#fPemilik').value.trim(), catatan: catatan,
    result: $('#fResult').value, plan: $('#fPlan').value.trim(), kategori: $('#fKategori').value,
    estimasi: '', spend: digits ? parseInt(digits, 10) : null
  };
  if (editingId) {
    const old = items.find(x => x.id === editingId);
    rec.estimasi = old ? old.estimasi : '';
    items = items.map(x => x.id === editingId ? rec : x);
  } else items.push(rec);
  closeForm(); persist();
});

/* ---------- event ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act, id = t.dataset.id;
  if (act === 'cycle' || act === 'setst') {
    e.stopPropagation();
    const it = items.find(x => x.id === id); if (!it) return;
    it.result = act === 'setst' ? t.dataset.v : ({ Rencana: 'Selesai', Selesai: 'Cancel', Cancel: 'Rencana' })[it.result];
    persist(); return;
  }
  if (act === 'tab') setTab(t.dataset.tab);
  else if (act === 'add') openForm();
  else if (act === 'edit') openForm(id);
  else if (act === 'close') closeForm();
  else if (act === 'reload') { if (dirty || saving) toast('Tunggu sampai tersimpan dulu.'); else load(); }
  else if (act === 'del') {
    if (t.dataset.armed !== '1') { t.dataset.armed = '1'; t.textContent = 'Yakin hapus?'; return; }
    items = items.filter(x => x.id !== editingId); closeForm(); persist(); toast('Aktivitas dihapus');
  }
  else if (act === 'useSheet') { const r = window._conflict; items = parseRows(r.rows); version = r.version; $('#banner').innerHTML = ''; setSync('ok'); renderToolbar(); render(); }
  else if (act === 'overwrite') { version = window._conflict.version; $('#banner').innerHTML = ''; persist(); }
});
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeForm(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeForm(); });
document.addEventListener('input', e => {
  if (e.target.id === 'q') { flt.q = e.target.value; render(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'fs') { flt.status = e.target.value; render(); }
  if (e.target.id === 'fm') { flt.month = e.target.value; render(); }
});

load();
</script>
</body>
</html>
